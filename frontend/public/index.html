<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UP Police — Data Analyst</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <h1>UP Police Data Analyst</h1>
      <span id="provider-badge" class="badge" title="Active LLM provider">…</span>
    </header>

    <section class="card" id="investigation-card">
      <h2>Investigation</h2>
      <div class="row">
        <div class="field">
          <label for="title">Title</label>
          <input id="title" type="text" value="District quarter analysis" />
        </div>
        <div class="actions">
          <button id="create-btn">Create investigation</button>
          <span id="inv-id" class="muted"></span>
        </div>
      </div>

      <p class="hint">Create an investigation first, then upload CSV files.</p>
      <div id="inv-error" class="error" hidden></div>
    </section>

    <section class="card" id="files-card">
      <h2>Files</h2>
      <input id="file-input" type="file" accept=".csv" />
      <button id="upload-btn" disabled>Upload CSV</button>
      <div id="file-meta" class="muted"></div>
      <div id="file-error" class="error" hidden></div>
    </section>

    <section class="card" id="chat-card">
      <h2>Ask a question</h2>
      <div id="history" class="history"></div>

      <label for="question">Question</label>
      <input id="question" type="text" placeholder="Which district has the highest count?" />
      <button id="ask-btn" disabled>Ask</button>
      <div id="status" class="status" hidden></div>
      <div id="error" class="error" hidden></div>

      <div id="result-wrap" hidden>
        <h3>Answer</h3>
        <pre id="answer"></pre>
        <div id="chart-wrap" class="chart-wrap"></div>
        <div id="citations" class="citations"></div>
        <div id="followups" class="followups"></div>
        <p class="meta" id="result-meta"></p>
      </div>
    </section>

    <footer class="foot">
      <span>API docs at <a href="/docs">/docs</a> · health at <a href="/health">/health</a></span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
